name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-report=term-missing --cov-report=xml
      - run: python -m scripts.check_openapi
      - run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run test -- --coverage
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - working-directory: frontend
        run: npm ci
      - working-directory: backend
        run: python -m scripts.export_openapi
      - working-directory: frontend
        run: npm run contracts:generate
      - run: git diff --exit-code -- backend/openapi.json frontend/src/contracts/generated/api.ts

  browser:
    # Visual baselines are platform-specific; regenerate intentionally when changing OS.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv backend/venv
      - run: backend/venv/bin/pip install -r backend/requirements.txt
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install chromium
      - working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: |
            frontend/playwright-report
            frontend/test-results
